# Builds the ProBooks server and webapp images and publishes them to the
# GitHub Container Registry, where docker-compose.coolify.yml pulls them from.
name: ProBooks images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: probooks-images
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [server, webapp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./packages/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/probooks-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/probooks-${{ matrix.app }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
