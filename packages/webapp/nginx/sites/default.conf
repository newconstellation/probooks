server {
    listen 80 default_server;

    # Phone photos of receipts are often 3-10 MB.
    client_max_body_size 25m;

    # When the webapp is the only public service (the ProBooks Coolify setup),
    # it forwards API calls to the server container. Other setups route /api
    # in front of nginx, so this block is never reached there. The variable
    # plus the Docker DNS resolver keeps nginx starting even when no "server"
    # host exists.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://server:3000;

    location /api {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
